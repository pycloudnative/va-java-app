<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java App</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #101827, #172554 55%, #0f766e);
            color: #e5eefb;
        }

        main {
            width: min(92%, 620px);
            padding: 48px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 24px;
            background: rgba(15, 23, 42, 0.72);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
            backdrop-filter: blur(12px);
        }

        .badge {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 999px;
            background: #14b8a6;
            color: #042f2e;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 22px 0 12px;
            font-size: clamp(2.4rem, 8vw, 4.5rem);
            line-height: 0.98;
        }

        p {
            color: #b6c5db;
            font-size: 1.08rem;
            line-height: 1.6;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 32px;
            padding: 18px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f59e0b;
            box-shadow: 0 0 18px #f59e0b;
        }

        .dot.online {
            background: #34d399;
            box-shadow: 0 0 18px #34d399;
        }

        #status-message { margin: 0; color: #e5eefb; }
        small { display: block; margin-top: 28px; color: #8191aa; }
    </style>
</head>
<body>
<main>
    <span class="badge">Java application</span>
    <h1>Hello from Spring Boot.</h1>
    <p>A simple webpage served directly by your Java application.</p>

    <div class="status">
        <span id="status-dot" class="dot"></span>
        <p id="status-message">Checking application status...</p>
    </div>

    <small>Powered by Spring Boot and Java 17</small>
</main>

<script>
    fetch("/api/status")
        .then(response => response.json())
        .then(data => {
            document.getElementById("status-dot").classList.add("online");
            document.getElementById("status-message").textContent = data.message;
        })
        .catch(() => {
            document.getElementById("status-message").textContent = "The application is unavailable.";
        });
</script>
</body>
</html>
